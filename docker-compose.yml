version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dental_voice
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dental_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_voice"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      DATABASE_URL: postgresql://dental:${DB_PASSWORD:-dental_dev_password}@db:5432/dental_voice
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      BASE_URL: ${BASE_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - server_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://server:3001
    depends_on:
      - server

volumes:
  pgdata:
  server_data:
